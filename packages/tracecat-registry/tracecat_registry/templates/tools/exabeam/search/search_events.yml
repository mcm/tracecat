type: action
definition:
  title: Search events
  description: >-
    Perform search queries across multiple years' worth of logs and events.
    Returns up to `limit` events in one response.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/search-2
  namespace: tools.exabeam
  name: search_events
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    payload:
      # Generic: the body's optional fields are not documented as nullable,
      # and a literal payload map cannot omit an unset optional.
      type: dict[str, Any]
      description: >-
        API-native request body. Documented fields: filter (required; filter
        for specific events), fields (required; list of fields to be returned
        from the search), startTime (required; timestamp to start the search,
        ISO-8601), endTime (required; timestamp to end the search, ISO-8601),
        limit (limit the number of events returned, default 3000), groupBy
        (list of fields to GROUP BY), orderBy (order fields by ASC or DESC),
        distinct (include or exclude DISTINCT from the SELECT clause, default
        false).
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: search_events
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/search/v2/events
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.search_events.result }}
