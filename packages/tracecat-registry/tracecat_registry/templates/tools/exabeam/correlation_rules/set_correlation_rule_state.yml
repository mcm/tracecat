type: action
definition:
  title: Set correlation rule state
  description: >-
    Set the state of a specific correlation rule.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/correlation-set-rule-state-by-id
  namespace: tools.exabeam
  name: set_correlation_rule_state
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    ruleId:
      type: str
      description: Correlation rule ID.
    status:
      type: str
      description: State to set for the rule. Allowed values are enable, disable.
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: set_correlation_rule_state
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/correlation-rules/v2/rules/${{ FN.url_encode(inputs.ruleId) }}/${{ FN.url_encode(inputs.status) }}
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
  returns: ${{ steps.set_correlation_rule_state.result }}
