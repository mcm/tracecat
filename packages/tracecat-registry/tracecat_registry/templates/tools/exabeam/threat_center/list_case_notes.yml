type: action
definition:
  title: List case notes
  description: >-
    Retrieve a list of notes associated with the specified `caseId`.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/threat-center-list-case-notes
  namespace: tools.exabeam
  name: list_case_notes
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    caseId:
      type: str
      description: Unique ID that identifies a case.
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: list_case_notes
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/threat-center/v1/cases/${{ FN.url_encode(inputs.caseId) }}/notes
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
  returns: ${{ steps.list_case_notes.result }}
