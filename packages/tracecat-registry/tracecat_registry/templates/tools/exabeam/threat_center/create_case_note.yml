type: action
definition:
  title: Create case note
  description: >-
    Add a new note to the specified case.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/threat-center-create-case-note
  namespace: tools.exabeam
  name: create_case_note
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    caseId:
      type: str
      description: Unique ID that identifies a case.
    note:
      type: str
      description: Note text.
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: create_case_note
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/threat-center/v1/cases/${{ FN.url_encode(inputs.caseId) }}/notes
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
        payload:
          note: ${{ inputs.note }}
  returns: ${{ steps.create_case_note.result }}
