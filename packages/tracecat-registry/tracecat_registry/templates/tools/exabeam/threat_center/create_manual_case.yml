type: action
definition:
  title: Create manual case
  description: >-
    Create a new case without an alert and set case details like `stage`,
    `priority`, `queue`, `assignee`, and `closedReason`.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/threat-center-create-manual-case-v1
  namespace: tools.exabeam
  name: create_manual_case
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    payload:
      # Generic: the body's optional fields are not documented as nullable, and
      # a literal payload map cannot omit an unset optional.
      type: dict[str, Any]
      description: >-
        API-native request body. Documented fields: alertName (required),
        alertDescription (required), priority (required; CRITICAL, HIGH,
        MEDIUM, LOW), assignee (defaults to Unassigned if omitted or invalid),
        stage (defaults to NEW if omitted; an invalid value is replaced by the
        first available stage), queue (defaults to Unassigned if omitted or
        invalid), closedReason (Already Mitigated or Resolved, False Positive
        or Duplicate, Low Risk, Rule Misconfiguration, Policy or Setup Issue,
        Other), supportingReason.
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: create_manual_case
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/threat-center/v1/manual-cases
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.create_manual_case.result }}
