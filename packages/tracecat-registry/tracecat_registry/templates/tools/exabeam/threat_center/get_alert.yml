type: action
definition:
  title: Get alert
  description: >-
    Get details for a specific alert, as identified by an alert ID.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/threat-center-get-alert-by-id
  namespace: tools.exabeam
  name: get_alert
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    alertId:
      type: str
      description: Unique ID that identifies an alert.
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: get_alert
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/threat-center/v1/alerts/${{ FN.url_encode(inputs.alertId) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
  returns: ${{ steps.get_alert.result }}
