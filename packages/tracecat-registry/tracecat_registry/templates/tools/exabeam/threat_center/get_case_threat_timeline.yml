type: action
definition:
  title: Get case threat timeline
  description: >-
    Get the threat timeline given a case ID. Returns one page; page with
    `limit` and `offset` and check `paging.next` in the response.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/threat-center-get-threat-timeline-by-case-id
  namespace: tools.exabeam
  name: get_case_threat_timeline
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    id:
      type: str
      description: Unique ID that identifies a case.
    offset:
      type: int | None
      description: Paging offset. Minimum 0; the API defaults to 0.
      default: null
    limit:
      type: int | None
      description: Number of timeline entries to return. The API defaults to 10.
      default: null
    alertCreationTimestamp:
      type: str | None
      description: The alert creation timestamp in ISO-8601 format.
      default: null
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: get_case_threat_timeline
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/threat-center/v1/threat-timeline/cases/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
        params:
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
          alertCreationTimestamp: ${{ inputs.alertCreationTimestamp }}
  returns: ${{ steps.get_case_threat_timeline.result }}
