type: action
definition:
  title: Export analytics rules
  description: >-
    Export a list of analytics rule definitions based on the provided rule
    IDs. A maximum of 50 rules can be exported at a time.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/detection-management-export-rules
  namespace: tools.exabeam
  name: export_analytics_rules
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    ruleIds:
      type: list[str]
      description: A list of rule IDs to export. Maximum 50.
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: export_analytics_rules
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/detection-management/v1/analytics-rules/export
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
        payload:
          ruleIds: ${{ inputs.ruleIds }}
  returns: ${{ steps.export_analytics_rules.result }}
