type: action
definition:
  title: List analytics rules
  description: >-
    Return all analytics rules that are created along with all their
    attributes.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/detection-management-get-all-analytics-rules
  namespace: tools.exabeam
  name: list_analytics_rules
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: list_analytics_rules
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/detection-management/v1/analytics-rules
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
  returns: ${{ steps.list_analytics_rules.result }}
