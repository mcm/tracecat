type: action
definition:
  title: Get context table
  description: >-
    Retrieve metadata for a specific context table, including source,
    operational status, and attribute mapping.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/getcontext-managementv1tablesid
  namespace: tools.exabeam
  name: get_context_table
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    id:
      type: str
      description: Specify the ID of an existing context table.
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: get_context_table
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/context-management/v1/tables/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
  returns: ${{ steps.get_context_table.result }}
