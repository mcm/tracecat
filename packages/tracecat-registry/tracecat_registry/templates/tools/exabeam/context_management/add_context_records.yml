type: action
definition:
  title: Add context records
  description: >-
    Add one or more context records directly to an existing table by including
    them in the request body. Use the value of `operation` to `append` the
    added data or `replace` the existing data.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/postcontext-managementv1tablesidaddrecords
  namespace: tools.exabeam
  name: add_context_records
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    id:
      type: str
      description: Specify the ID of an existing context table.
    payload:
      # Generic: the request body has an optional field (data) that is not
      # documented as nullable, and a literal payload map cannot omit an unset
      # optional.
      type: dict[str, Any]
      description: >-
        API-native request body. Documented fields: operation (required; options
        for how data should be uploaded to an existing table: append, replace),
        data (list of objects, each mapping attribute IDs to string values, e.g.
        `{"xym85GfP": "John", "GsqqBM5h": "Doe"}`; attribute IDs come from
        `get_context_attributes`).
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: add_context_records
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/context-management/v1/tables/${{ FN.url_encode(inputs.id) }}/addRecords
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.add_context_records.result }}
