type: action
definition:
  title: Get context upload status
  description: >-
    Track ingestion progress. Use the tracker ID from one of the add or delete
    records actions to poll the status of the job.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/getcontext-managementv1tablesuploadstatustrackerid
  namespace: tools.exabeam
  name: get_context_upload_status
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    trackerId:
      type: str
      description: >-
        Specify the tracker ID from an upload request whose progress you want
        to track.
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: get_context_upload_status
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/context-management/v1/tables/uploadStatus/${{ FN.url_encode(inputs.trackerId) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
  returns: ${{ steps.get_context_upload_status.result }}
