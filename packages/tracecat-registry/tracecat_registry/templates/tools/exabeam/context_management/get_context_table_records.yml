type: action
definition:
  title: Get context table records
  description: >-
    Retrieve the records for a specific context table. Returns one page; page
    with `limit` and `offset`.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/getcontext-managementv1tablesidrecords
  namespace: tools.exabeam
  name: get_context_table_records
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    id:
      type: str
      description: ID for the specified table.
    limit:
      type: int | None
      description: The number of records to return per page.
      default: null
    offset:
      type: int | None
      description: The number of rows to skip before beginning to return records.
      default: null
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: get_context_table_records
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/context-management/v1/tables/${{ FN.url_encode(inputs.id) }}/records
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
        params:
          limit: ${{ inputs.limit }}
          offset: ${{ inputs.offset }}
  returns: ${{ steps.get_context_table_records.result }}
