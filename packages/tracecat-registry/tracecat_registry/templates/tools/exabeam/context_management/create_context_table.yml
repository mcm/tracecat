type: action
definition:
  title: Create context table
  description: >-
    Create a custom context table (only CUSTOM table creation is supported) with
    attributes that define the schema. Create new attributes by providing unique
    names or reuse existing attributes by providing their IDs (from
    `get_context_attributes`). Use `isKey` to designate the key attribute; a
    table can have only one key attribute.
  display_group: Exabeam
  doc_url: https://developers.exabeam.com/exabeam/reference/postcontext-managementv1tables
  namespace: tools.exabeam
  name: create_context_table
  secrets:
    - type: oauth
      provider_id: exabeam
      grant_type: client_credentials
  expects:
    payload:
      # Generic: the request body has an optional field (attributes) that is
      # not documented as nullable, and a literal payload map cannot omit an
      # unset optional.
      type: dict[str, Any]
      description: >-
        API-native request body. Documented fields: name (required; table
        display name), contextType (required; Other, User), source (required;
        the vendor from which the table will be sourced: Custom), attributes
        (list of table metadata attributes; each is either a new attribute
        `{"displayName": "<name>", "isKey": <bool>}` or an existing attribute
        `{"id": "<attribute ID>", "isKey": <bool>}`).
    base_url:
      type: str | None
      description: Exabeam API base URL (e.g. https://api.us-west.exabeam.cloud).
      default: null
  steps:
    - ref: create_context_table
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.exabeam.base_url }}/context-management/v1/tables
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.exabeam_oauth.EXABEAM_SERVICE_TOKEN }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.create_context_table.result }}
